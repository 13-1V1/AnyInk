<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>ANY-INK test pages</title>
	<style>
		body { font-family: 'Segoe UI', system-ui, sans-serif; background: #111318; color: #e6e8eb; margin: 32px; }
		a { color: #16A34A; } code { color: #a78bfa; }
		#probe { margin-top: 24px; padding: 12px; border: 1px solid #7C3AED; border-radius: 6px; }
	</style>
</head>
<body>
	<h1>ANY-INK test pages</h1>
	<p>Minimal pages that load one feature at a time. Run with <code>npm run pages</code>. Never in the production build.</p>
	<ul id="pages">
		<li><a href="./index.html">index</a> — this page: proves a page here can import from <code>src/</code></li>
	</ul>
	<div id="probe">probing…</div>
	<script type="module">
		// Upstream modules call a bare log(); the app sets it in index.html. Test pages must too.
		window.log = () => {};
		import { rgbToHex } from '../src/common/colors.js';
		import config from '../src/app/app_config.json';
		document.querySelector('#probe').textContent =
			`import from src/ works: rgbToHex('rgb(22,163,74)') = ${rgbToHex('rgb(22,163,74)')} · ANY-INK ${config.anyinkVersion} on Glyphr Studio ${config.version}`;
	</script>
</body>
</html>
