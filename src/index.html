	<head>
		<meta charset="utf-8" />
		<title>ANY-INK</title>
		<meta name="viewport" content="width=device-width" />
		<link rel="icon" type="image/svg+xml" href="./common/graphics/anyink-icon.svg" />
		<link rel="manifest" href="manifest.json" />
		<script type="module">
			// Apply the remembered canvas theme before anything paints (ANY-INK).
			import { initTheme } from './anyink/theme/theme.js';
			initTheme();
		</script>
		<script src="app/main.js" type="module"></script>
		<script type="module">
			import { glyphrStudioOnLoad, getGlyphrStudioApp, log } from './app/main.js';
			window.log = log;
			document.addEventListener('DOMContentLoaded', glyphrStudioOnLoad);
			window._GlyphrStudioApp = getGlyphrStudioApp();
		</script>
		<style>
			body,
			#app__wrapper,
			#app__landing-page {
				height: 100%;
				width: 100%;
				min-height: 100%;
				min-width: 100%;
				position: absolute;
				top: 0px;
				left: 0px;
				overflow: hidden;
			}

			body {
				background: var(--chrome-bg);
			}

			#app__wrapper {
				background-color: var(--chrome-bg);
			}

			#app__landing-page {
				font-family: var(--font-ui);
				opacity: 1;
				visibility: visible;
				transition: opacity 500ms ease-out;
				background-color: var(--chrome-bg);
				color: var(--chrome-text);
				padding: auto;
				text-align: left;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding-bottom: 189px;
			}

			#app__landing-page svg,
			#app__landing-page #errorMessage {
				margin: 90px 0px 0px 50px;
			}

			.mainLogo {
				fill: var(--chrome-text);
				width: 300px;
			}

			.mainLogo .logoWords {
				fill: transparent;
				stroke-width: 0.4px;
				stroke: var(--structure);
			}

			.error-page__wrapper {
				margin: auto;
				font-size: 16px;
				text-align: center;
				color: var(--chrome-text);
			}

			.error-page__table-flip {
				font-size: 36px;
				opacity: 0.8;
				font-weight: bold;
				padding-bottom: 20px;
				text-align: center;
				color: var(--danger);
				letter-spacing: -2px;
			}

			.error-page__wrapper h1 {
				text-align: center;
				color: var(--chrome-text);
			}

			.error-page__wrapper a {
				color: var(--structure);
				text-decoration: underline;
			}

			.error-page__wrapper pre {
				border: var(--hairline);
				background-color: var(--chrome-bg-sunken);
				border-radius: var(--radius);
				text-align: left;
				font-family: var(--font-mono);
				padding: 10px;
				width: 100%;
				user-select: text;
			}
		</style>
		<link rel="stylesheet" type="text/css" href="./anyink/theme/tokens.css" />
		<link rel="stylesheet" type="text/css" href="./app/app.css" />
		<link rel="stylesheet" type="text/css" href="./common/resets.css" />
		<link rel="stylesheet" type="text/css" href="./controls/dialogs/dialogs.css" />
		<link rel="stylesheet" type="text/css" href="./controls/fancy-slider/fancy-slider.css" />
		<link rel="stylesheet" type="text/css" href="./controls/tabs/tab-control.css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="./controls/progress-indicator/progress-indicator.css"
		/>
		<link rel="stylesheet" type="text/css" href="./project_editor/nav.css" />
		<link rel="stylesheet" type="text/css" href="./pages/editor-pages.css" />
		<link rel="stylesheet" type="text/css" href="./pages/content-pages.css" />
		<link rel="stylesheet" type="text/css" href="./app/app-pages.css" />
		<link rel="stylesheet" type="text/css" href="./panels/panels.css" />
	</head>

	<body
		style="
			background-color: var(--chrome-bg);
			width: 100%;
			height: 100%;
			min-width: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
		"
	>
		<div id="app__landing-page">
			<svg
				version="1.1"
				xmlns="http://www.w3.org/2000/svg"
				xmlns:xlink="http://www.w3.org/1999/xlink"
				xml:space="preserve"
				viewBox="0 0 200 128"
				enable-background="new 0 0 200 128"
				class="mainLogo"
			></svg>
			<script>
				setTimeout(function () {
					let errorDiv = document.querySelector('#errorMessage');
					if (errorDiv) {
						errorDiv.style.display = 'block';
						document.querySelector('.mainLogo').style.display = 'none';
					}
				}, 5000);
			</script>

			<div id="errorMessage" style="display: none; width: 400px">
				<div
					style="font-size: 80px; padding-bottom: 20px; text-align: center; color: var(--danger)"
				>
					¯\_(ツ)_/¯
				</div>

				<div
					style="margin: auto; font-size: 16px; text-align: center; color: var(--chrome-text)"
				>
					It looks like ANY-INK failed to load.
					<br />
					Try the latest version of Chrome or Edge, and check the
					browser console for details.
				</div>
			</div>
		</div>

		<div id="app__wrapper"></div>
	</body>
</html>
